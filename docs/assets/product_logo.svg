<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Dark Theme Beams -->
    <linearGradient id="beam-dark-1" x1="50%" y1="50%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#c4b5fd" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-dark-2" x1="50%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#e879f9" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Solar Caustic Rotation Filter -->
    <filter id="solar-flare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sun-spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sun-spin-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes beam-pulse {
      0% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 1.0; transform: scale(1.18); }
      100% { opacity: 0.65; transform: scale(0.95); }
    }
    @keyframes core-glow-breathe {
      0% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.7)) drop-shadow(0 0 10px rgba(167,139,250,0.5)); }
      50% { filter: drop-shadow(0 0 10px rgba(255,255,255,1)) drop-shadow(0 0 22px rgba(192,132,252,0.9)); }
      100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.7)) drop-shadow(0 0 10px rgba(167,139,250,0.5)); }
    }
    .sun-shafts-primary {
      transform-origin: 60px 60px;
      animation: sun-spin-cw 16s linear infinite, beam-pulse 3.5s ease-in-out infinite alternate;
    }
    .sun-shafts-secondary {
      transform-origin: 60px 60px;
      animation: sun-spin-ccw 10s linear infinite, beam-pulse 2.8s ease-in-out infinite alternate-reverse;
    }
    .star-core-group {
      animation: core-glow-breathe 3.5s ease-in-out infinite alternate;
      transform-origin: 60px 60px;
    }
  </style>

  <!-- 1. Secondary Ambient Beams (Counter-clockwise) -->
  <g class="sun-shafts-secondary" filter="url(#solar-flare)" opacity="0.75">
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(22.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(67.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(112.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(157.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(202.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(247.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(292.5 60 60)" />
    <polygon points="60,60 56,12 64,12" fill="url(#beam-dark-2)" transform="rotate(337.5 60 60)" />
  </g>

  <!-- 2. Primary Strong Sunlight God-Rays (Clockwise) -->
  <g class="sun-shafts-primary" filter="url(#solar-flare)">
    <!-- 8 Main Solar Beams Shooting Outward -->
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(45 60 60)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(90 60 60)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(135 60 60)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(180 60 60)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(225 60 60)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(270 60 60)" />
    <polygon points="60,60 55,4 65,4" fill="url(#beam-dark-1)" transform="rotate(315 60 60)" />
  </g>

  <!-- 3. Star Core Emblem (Raster/Vector Hybrid or Star Graphic) -->
  <g class="star-core-group">
    <image href="/nav-star.png" x="38" y="38" width="44" height="44" />
  </g>
</svg>