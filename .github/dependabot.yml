version: 2
updates:
  # Cargo (Rust) dependencies
  - package-ecosystem: "cargo"
    directory: "/maho"
    schedule:
      interval: "daily"
  - package-ecosystem: "cargo"
    directory: "/maho/relay"
    schedule:
      interval: "daily"
  - package-ecosystem: "cargo"
    directory: "/mail"
    schedule:
      interval: "daily"

  # Bun / NPM dependencies
  - package-ecosystem: "npm"
    directory: "/maho"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/maho/maho-webui"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/maho/web-ai"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/maho/appium-tests"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/mail"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "daily"

  # WebUI / resources npm dependencies under maho-chromium
  - package-ecosystem: "npm"
    directory: "/maho-chromium/browser/resources/maho_boost_content_script"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/maho-chromium/browser/resources/maho_ai"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/maho-chromium/browser/resources/maho_welcome"
    schedule:
      interval: "daily"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
