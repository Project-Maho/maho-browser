name: Cross-platform build

# Required PR check. Builds Maho on all four target platforms via self-hosted
# runners. Configure the four `build (<os>)` jobs as required status checks on
# the `main` branch (Settings → Branches → main protection).

on:
  pull_request:
    paths:
      - 'maho/**'
      - 'maho-chromium/**'
      - '!**.md'
  push:
    branches: [main]
    paths:
      - 'maho/**'
      - 'maho-chromium/**'
      - '!**.md'

jobs:
  build:
    name: build (${{ matrix.os }})
    concurrency:
      group: chromium-build-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            labels: [self-hosted, chromium-builder, macos, arm64]
          - os: linux-x64
            labels: [self-hosted, chromium-builder, linux, x64]
          - os: linux-arm64
            labels: [self-hosted, chromium-builder, linux, arm64]
          - os: windows-x64
            labels: [self-hosted, chromium-builder, windows, x64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Sync Chromium
        run: gclient sync

      - name: Build
        run: python3 maho-chromium/build/scripts/build_maho.py

      - name: Runtime smoke (built browser + CLI)
        env:
          MAHO_MATRIX_OS: ${{ matrix.os }}
        run: |
          case "$MAHO_MATRIX_OS" in
            macos-arm64)
              python3 maho/scripts/verify_desktop_runtime_smoke.py                 --browser chromium/src/out/Default/Maho.app/Contents/MacOS/Maho                 --cli chromium/src/out/Default/maho ;;
            windows-x64)
              python3 maho/scripts/verify_desktop_runtime_smoke.py                 --browser chromium/src/out/Default/chrome.exe                 --cli chromium/src/out/Default/maho.exe ;;
            *)
              xvfb-run -a python3 maho/scripts/verify_desktop_runtime_smoke.py                 --browser chromium/src/out/Default/chrome                 --cli chromium/src/out/Default/maho ;;
          esac
