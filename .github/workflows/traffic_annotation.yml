name: Traffic Annotation Audit
on:
  pull_request:
    paths:
      - 'maho-chromium/browser/ui/webui/**/*_page_handler.cc'
      - 'maho-chromium/browser/net/**'
jobs:
  audit:
    runs-on: [self-hosted, chromium-builder]
    steps:
      - uses: actions/checkout@v4
      - name: Run Traffic Annotation Audit
        run: python3 maho-chromium/build/scripts/run_traffic_annotation_audit.py
