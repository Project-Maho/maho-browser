name: Revenue E2E

# Runs the revenue E2E integration test on every PR and push that touches the
# maho Rust workspace.  Uses an in-process mock relay + mock billing-proxy
# (axum) — no external network, no Cloudflare/LS credentials required.
#
# NOTE: This test covers the client↔relay contract only.  The real wasm32
# maho-billing-proxy Durable-Object ceiling/reserve-commit logic is NOT
# exercised here; see docs/operations/revenue-e2e-staging.md for the manual
# staging procedure that covers those paths.

on:
  pull_request:
    paths:
      - 'maho/**'
      - '!**.md'
  push:
    branches: [main]
    paths:
      - 'maho/**'
      - '!**.md'

jobs:
  revenue-e2e:
    name: Revenue E2E (maho-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            maho/target
          key: ${{ runner.os }}-cargo-revenue-e2e-${{ hashFiles('maho/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-revenue-e2e-

      - name: Run revenue E2E test
        working-directory: maho
        run: cargo test -p maho-cli --test revenue_e2e -- --nocapture
