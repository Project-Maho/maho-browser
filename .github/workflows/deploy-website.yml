name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'SITE_URL override (default: https://maho.app)'
        required: false
        default: 'https://maho.app'

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          SITE_URL: ${{ github.event.inputs.site_url || 'https://maho.app' }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=maho-website --branch=main --commit-dirty=true
          workingDirectory: .

      - name: Smoke test deployed site
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" https://maho-website.pages.dev/)
          echo "Production root status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Production root returned non-200 ($status)"
            exit 1
          fi
          for path in /pricing/ /compare/aside/ /why/ /about/ /roadmap/ /download/; do
            s=$(curl -s -L -o /dev/null -w "%{http_code}" "https://maho-website.pages.dev${path}")
            echo "$path → $s"
            if [ "$s" != "200" ]; then
              echo "::warning::Non-200 on $path ($s)"
            fi
          done
