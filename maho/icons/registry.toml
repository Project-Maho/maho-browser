# Authoritative cross-platform icon registry for Maho non-WebUI shells.
# Format:
# [[icon]]
# name = "semantic_name"
# description = "Brief description of usage"
# sizes = ["size1", "size2"]
#   [icon.platforms]
#   views = "C++ vector_icons symbol or local symbol"
#   apple = "SF Symbols name (shared or base name)"
#   android = "Compose Material Icon reference"

[[icon]]
name = "nav_back"
description = "Navigate back in history"
sizes = ["16", "20", "24"]
[icon.platforms]
views = "vector_icons::kBackArrowIcon"
apple = "chevron.backward"
android = "Icons.AutoMirrored.Filled.ArrowBack"

