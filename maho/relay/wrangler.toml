name = "maho-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-08"
account_id = "b1c1bfc44b1313b6f51553095ccb2eb4"

[build]
command = "cargo install -q worker-build --version \"^0.1\" 2>/dev/null; worker-build --release"

# ---- Production ----
[env.production]
routes = [
  { pattern = "relay.mahobrowser.com", custom_domain = true },
  { pattern = "update.mahobrowser.com", custom_domain = true },
  { pattern = "updates.mahobrowser.com", custom_domain = true },
  { pattern = "proxy.mahobrowser.com", custom_domain = true },
]

[[env.production.d1_databases]]
binding = "MAHO_DB"
database_name = "maho-relay-db"
database_id = "af9d394f-f6b6-4e85-a666-bd1258671929"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# Cloudflare Rate Limiting bindings (edge-backed, shared across isolates).
# Verify staging accepts this binding shape before relying on it; if the plan
# lacks rate-limit bindings, ratelimit.rs's `check` interface allows a DO fallback.
[[env.production.unsafe.bindings]]
name = "RL_SIGNUP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_LOGIN"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_WAITLIST"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_REFRESH"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[env.production.vars]
REQUIRE_AUTH = "true"
OPEN_REGISTRATION = "true"
MIN_PASSWORD_LENGTH = "12"
MAX_ROOM_SIZE_MB = "50"
MAX_MESSAGE_SIZE_BYTES = "1048576"
MAX_CONNECTIONS_PER_ROOM = "5"
RETENTION_DAYS = "30"
MAHO_FROM_EMAIL = "Maho <noreply@mahobrowser.com>"
MAHO_VERIFY_URL = "https://mahobrowser.com/verify"
MAHO_ENV = "production"
# Google Sign-In client IDs allowed as id_token `aud` (public, not secrets).
GOOGLE_OAUTH_ALLOWED_AUDS = "650357306759-c6tn05kg1l60ved2ne6cf9jp33moanh0.apps.googleusercontent.com,650357306759-hlbl52sp5f1jjo0jhtfionpb1l63tolq.apps.googleusercontent.com"
# Desktop OAuth client id for the server-side loopback code exchange (public, not a secret).
GOOGLE_OAUTH_CLIENT_ID = "650357306759-c6tn05kg1l60ved2ne6cf9jp33moanh0.apps.googleusercontent.com"
# LemonSqueezy variant IDs (public, not secrets). Real noveling.lemonsqueezy.com
# store subscription variants: Pro ($5) = 1985817, Max ($20) = 1985825.
# PAYG credit-pack IDs below are STILL PLACEHOLDERS — replace with real store IDs
# before enabling credit-pack purchases, else those orders record no credit.
LS_VARIANT_PRO = "1985817"
LS_VARIANT_MAX = "1985825"
LS_VARIANT_PAYG_10 = "4001"
LS_VARIANT_PAYG_50 = "4002"
LS_VARIANT_PAYG_100 = "4003"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# ---- Staging ----
[env.staging]
routes = [
  { pattern = "relay-staging.mahobrowser.com", custom_domain = true },
]

[[env.staging.d1_databases]]
binding = "MAHO_DB"
database_name = "maho-relay-db-staging"
database_id = "1f2d9cec-fe46-4ec7-ad7e-82c954098412"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[env.staging.unsafe.bindings]]
name = "RL_SIGNUP"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RL_LOGIN"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RL_WAITLIST"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RL_REFRESH"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 60, period = 60 }

[env.staging.vars]
REQUIRE_AUTH = "true"
OPEN_REGISTRATION = "true"          # staging allows registration for testing
MIN_PASSWORD_LENGTH = "8"
MAX_ROOM_SIZE_MB = "50"
MAX_MESSAGE_SIZE_BYTES = "1048576"
MAX_CONNECTIONS_PER_ROOM = "5"
RETENTION_DAYS = "7"
MAHO_FROM_EMAIL = "Maho Staging <noreply@mahobrowser.com>"
MAHO_VERIFY_URL = "https://relay-staging.mahobrowser.com/verify"
MAHO_ENV = "staging"
GOOGLE_OAUTH_ALLOWED_AUDS = "650357306759-c6tn05kg1l60ved2ne6cf9jp33moanh0.apps.googleusercontent.com,650357306759-hlbl52sp5f1jjo0jhtfionpb1l63tolq.apps.googleusercontent.com"
# Desktop OAuth client id for the server-side loopback code exchange (public, not a secret).
GOOGLE_OAUTH_CLIENT_ID = "650357306759-c6tn05kg1l60ved2ne6cf9jp33moanh0.apps.googleusercontent.com"
LS_VARIANT_PRO = "1970139"
LS_VARIANT_MAX = "2002"
LS_VARIANT_PAYG_10 = "4001"
LS_VARIANT_PAYG_50 = "4002"
LS_VARIANT_PAYG_100 = "4003"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# ---- Scheduled (both environments) ----
[triggers]
crons = ["0 * * * *"]   # hourly maintenance
