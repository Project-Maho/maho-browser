name: Maho
packages:
  LucideIcons:
    url: https://github.com/JakubMazur/lucide-icons-swift
    from: "1.0.0"
options:
  bundleIdPrefix: dev.maho
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Maho-Bridging-Header.h"
    HEADER_SEARCH_PATHS: ["$(SRCROOT)/include"]
    LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/build/universal"]
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/build/ios"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/build/sim"
    OTHER_LDFLAGS: ["-lmaho_ffi", "-framework", "WebKit", "-framework", "Security", "-framework", "SystemConfiguration", "-framework", "Speech", "-framework", "AVFoundation"]
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_IDENTITY: "Apple Distribution"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # DEVELOPMENT_TEAM is provided by Signing.xcconfig (gitignored, per-developer)
    # or by the CI environment. Do NOT hardcode a placeholder here — a missing
    # team ID should fail the build loudly with "requires a development team".


targets:
  Maho:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: MahoApp.swift
      - path: Models
      - path: Bridge
      - path: Support
      - path: Views
      - path: Integration
      - path: Extensions
        excludes:
          - "ShareExtension/**"
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maho.browser
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LucideIcons

  MahoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Maho
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maho.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Maho"

  MahoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Maho
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Maho

  MahoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maho.browser.share-extension
        INFOPLIST_FILE: ShareExtension/Info.plist
    dependencies:
      - target: Maho

  MahoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MahoWidget
    info:
      path: MahoWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maho.browser.widget
        INFOPLIST_FILE: MahoWidget/Info.plist
    dependencies:
      - target: Maho
