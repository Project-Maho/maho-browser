language = "C"
header = "/* Auto-generated by cbindgen. Do not edit. */\ntypedef struct MahoCore MahoCore;\ntypedef struct ChatSession ChatSession;"
include_guard = "MAHO_FFI_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify manually. */"
tab_width = 4
style = "both"
cpp_compat = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

[parse]
parse_deps = true
include = ["maho-core", "maho-types"]

[export]
prefix = ""

[export.mangle]
remove_underscores = false

[enum]
prefix_with_name = true
