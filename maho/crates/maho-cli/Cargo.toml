[package]
name = "maho-cli"
version = "0.1.0"
edition = "2021"
description = "Maho CLI — chat with AI from your terminal"

[lib]
name = "maho_cli"
path = "src/lib.rs"

[[bin]]
name = "maho"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10.3"
clap = { version = "4", features = ["derive"] }
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
rpassword = "7"
toml = "0.8"
open = "5"
maho-browser-mcp = { path = "../maho-browser-mcp", default-features = false }
maho-storage = { path = "../maho-storage" }
maho-types = { path = "../maho-types" }
maho-agent = { path = "../maho-agent" }
maho-core = { path = "../maho-core" }
maho-platform = { path = "../maho-platform" }
async-trait = "0.1"
rustyline = "14"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["signal", "process"] }
base64 = "0.22"
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde_json = "1"
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
chrono = { workspace = true }
zeroize = "1"
