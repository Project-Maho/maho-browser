[package]
name = "maho-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
maho-types = { path = "../maho-types" }
maho-storage = { path = "../maho-storage" }
maho-core = { path = "../maho-core" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
swiftide-agents = "0.32"
swiftide-integrations = { version = "0.32", features = ["openai", "anthropic"] }
async-openai = { version = "=0.30.1" }
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
futures = "0.3"
anyhow = "1"
dyn-clone = "1"
swiftide-core = "0.32"
async-anthropic = "0.6"
uuid = { workspace = true }
libc = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio-stream = "0.1"
hyper = { version = "1", features = ["full"] }
maho-core = { path = "../maho-core" }
