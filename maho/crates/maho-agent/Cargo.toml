[package]
name = "maho-agent"
version = "0.1.0"
edition = "2021"

[features]
default = []
vault-agent-tools = []
# Test-only hooks (forced sandbox unavailability, induced panics). Official
# and release builds never enable this feature.
debug-test-hooks = []
# Dispatches visual CUA native actions to the browser MCP native-input tools.
visual-cua-native = []

[dependencies]
maho-types = { path = "../maho-types" }
maho-storage = { path = "../maho-storage" }
maho-core = { path = "../maho-core" }
maho-browser-mcp = { path = "../maho-browser-mcp", default-features = false }
async-trait = "0.1"
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-async-rw"] }
futures = "0.3"
anyhow = "1"
dyn-clone = "1"
uuid = { workspace = true }
chrono = { workspace = true }
libc = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false }
rquickjs = { version = "0.14", default-features = false }
rust_xlsxwriter = "0.99"
docx-rs = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
# The default "html" feature pulls in the azul layout engine; artifacts are
# laid out directly, so only the core writer is needed.
printpdf = { version = "0.12", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
calamine = "0.36"
lopdf = { version = "0.44", default-features = false }
quick-xml = "0.41"
axum = "0.8"
tokio-stream = "0.1"
hyper = { version = "1", features = ["full"] }
maho-core = { path = "../maho-core" }
