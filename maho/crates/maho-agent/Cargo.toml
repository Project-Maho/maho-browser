[package]
name = "maho-agent"
version = "0.1.0"
edition = "2021"

[features]
default = []
vault-agent-tools = []

[dependencies]
maho-types = { path = "../maho-types" }
maho-storage = { path = "../maho-storage" }
maho-core = { path = "../maho-core" }
maho-browser-mcp = { path = "../maho-browser-mcp", default-features = false }
async-trait = "0.1"
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-async-rw"] }
futures = "0.3"
anyhow = "1"
dyn-clone = "1"
uuid = { workspace = true }
chrono = { workspace = true }
libc = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio-stream = "0.1"
hyper = { version = "1", features = ["full"] }
maho-core = { path = "../maho-core" }
