[package]
name = "maho-browser-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "maho_browser_mcp"
path = "src/lib.rs"

[[bin]]
name = "maho-browser-mcp"
path = "src/bin/maho-browser-mcp.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = "1"
directories = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
serde_json = { workspace = true }
anyhow = { workspace = true }
