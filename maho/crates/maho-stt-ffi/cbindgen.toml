language = "C"
cpp_compat = true
header = "/* Generated by cbindgen - DO NOT EDIT. Regenerate: cbindgen --config cbindgen.toml --lockfile Cargo.lock --output ../../../maho-chromium/third_party/maho/maho_stt_ffi.h */"
include_guard = "MAHO_STT_FFI_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
style = "both"
autogen_warning = "/* This file is auto-generated from maho-stt-ffi. Do not edit by hand. */"

[export]
prefix = ""

[export.mangle]
remove_underscores = false

[parse]
parse_deps = false

[enum]
prefix_with_name = true
