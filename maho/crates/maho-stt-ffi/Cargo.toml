[package]
name = "maho-stt-ffi"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "maho_stt_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]

[dependencies]
maho-stt = { path = "../maho-stt" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
