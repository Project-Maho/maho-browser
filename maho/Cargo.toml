[workspace]
resolver = "2"
members = [
    "crates/maho-types",
    "crates/maho-core",
    "crates/maho-ffi",
    "crates/maho-storage",
    "crates/maho-bench",
    "crates/maho-acp",
    "crates/maho-import", "crates/maho-agent", "crates/maho-jni",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
psl = "2"
thiserror = "1"
