<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview</title>
  <style>
    :root {
      --color-page: #07080b;
      --color-shell: #111318;
      --color-shell-top: #171920;
      --color-shell-bottom: #0d0f14;
      --color-panel-edge: rgba(255, 255, 255, 0.07);
      --color-panel-soft: rgba(255, 255, 255, 0.04);
      --color-panel-strong: rgba(255, 255, 255, 0.1);
      --color-chip: #1b1d23;
      --color-chip-text: #d9dde5;
      --color-pill: #14161c;
      --color-pill-top: #20232b;
      --color-pill-bottom: #16181e;
      --color-muted: #8690a3;
      --color-placeholder: #6e7686;
      --color-control: #16181e;
      --color-control-hover: #1b1e25;
      --color-send: #ffffff;
      --color-send-icon: #0c0d10;
      --color-shadow: rgba(0, 0, 0, 0.52);
      --color-glow: rgba(132, 149, 198, 0.12);

      --radius-shell: 28px;
      --radius-chip: 999px;
      --radius-composer: 28px;
      --radius-context: 18px;
      --radius-control: 999px;
      --radius-icon: 10px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;

      --panel-width: min(412px, calc(100vw - (var(--space-6) * 2)));
      --panel-height: min(864px, calc(100vh - (var(--space-6) * 2)));
      --control-size: 24px;
      --send-size: 48px;
      --shadow-shell: 0 32px 90px var(--color-shadow);
      --shadow-composer: 0 18px 40px rgba(0, 0, 0, 0.34);
      --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 255, 255, 0.04), transparent 30%),
        radial-gradient(circle at 50% 120%, rgba(93, 104, 136, 0.12), transparent 34%),
        var(--color-page);
      color: var(--color-chip-text);
      font-family: var(--font-ui);
    }

    body {
      display: grid;
      place-items: center;
      padding: var(--space-6);
      overflow: hidden;
    }

    .mock {
      position: relative;
      width: var(--panel-width);
      height: var(--panel-height);
      padding: 10px;
      border-radius: var(--radius-shell);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 12%),
        linear-gradient(180deg, var(--color-shell-top), var(--color-shell-bottom));
      border: 1px solid var(--color-panel-edge);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      overflow: hidden;
      isolation: isolate;
    }

    .mock::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.05), transparent 24%),
        radial-gradient(circle at 80% 100%, rgba(118, 133, 168, 0.1), transparent 28%);
      pointer-events: none;
      z-index: -1;
    }

    .mock::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0.015)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.012) 50%, transparent 50%);
      background-size: 100% 100%, 3px 3px;
      mix-blend-mode: soft-light;
      opacity: 0.22;
      pointer-events: none;
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 12px 10px 10px;
      border-radius: calc(var(--radius-shell) - 6px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 12%),
        linear-gradient(180deg, rgba(13, 15, 20, 0.5), rgba(13, 15, 20, 0.18));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 30px;
      padding: 4px 2px 0;
    }

    .topbar-side {
      display: flex;
      align-items: center;
    }

    .topbar-right {
      gap: 14px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: var(--control-size);
      height: var(--control-size);
      padding: 0;
      border: 0;
      border-radius: var(--radius-icon);
      background: transparent;
      color: rgba(233, 236, 242, 0.72);
      box-shadow: none;
    }

    .icon-button svg,
    .action svg,
    .send svg,
    .context-mark svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .icon-button.chevron {
      width: 10px;
      margin-left: -10px;
      margin-right: -2px;
    }

    .icon-button.close-top {
      color: rgba(233, 236, 242, 0.82);
    }

    .workspace {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 0;
      padding: 0 4px 4px;
    }

    .chips {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      padding-left: 2px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--radius-chip);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 70%),
        rgba(34, 36, 42, 0.9);
      color: rgba(229, 232, 238, 0.88);
      font-size: 14px;
      font-weight: 540;
      letter-spacing: -0.015em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .composer {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 286px;
      padding: 28px 22px 18px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-composer);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.025), transparent 36%),
        linear-gradient(180deg, #2b2b2d, #2a2a2c);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
    }

    .composer-head {
      position: relative;
      display: flex;
      align-items: flex-start;
    }

    .composer-close {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      margin-left: -6px;
      margin-top: -14px;
      border: 0;
      border-radius: 50%;
      background: rgba(112, 112, 115, 0.9);
      color: rgba(245, 245, 246, 0.95);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .composer-close svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .context-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      max-width: 256px;
      width: max-content;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 70%),
        rgba(86, 86, 89, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .context-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 10px;
      background: #070708;
      color: #dfe4ef;
    }

    .context-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 2px;
    }

    .context-title,
    .context-url {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .context-title {
      color: #e3e7ef;
      font-size: 16px;
      font-weight: 590;
      letter-spacing: -0.03em;
    }

    .context-url {
      color: rgba(210, 212, 217, 0.68);
      font-size: 14px;
      font-weight: 520;
      letter-spacing: -0.02em;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: flex-start;
      color: rgba(194, 196, 202, 0.8);
      font-size: 24px;
      font-weight: 520;
      line-height: 1.18;
      letter-spacing: -0.045em;
      max-width: 340px;
      padding-left: 0;
      padding-top: 10px;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .action,
    .send {
      display: inline-grid;
      place-items: center;
      border: 0;
      padding: 0;
      cursor: default;
    }

    .action {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-control);
      background: transparent;
      color: rgba(205, 208, 214, 0.62);
      box-shadow: none;
    }

    .action.secondary {
      background: transparent;
    }

    .send {
      width: var(--send-size);
      height: var(--send-size);
      border-radius: 50%;
      background: var(--color-send);
      color: var(--color-send-icon);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    .send svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.1;
    }

    @media (max-width: 560px) {
      :root {
        --panel-width: min(412px, calc(100vw - (var(--space-4) * 2)));
        --panel-height: min(864px, calc(100vh - (var(--space-4) * 2)));
      }

      body {
        padding: var(--space-4);
      }

      .placeholder {
        font-size: 22px;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <main class="mock" aria-label="AI side panel mock">
    <section class="panel">
      <header class="topbar" aria-label="Top controls">
        <div class="topbar-side topbar-left">
          <button class="icon-button" aria-label="Edit page context">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4h8" />
              <path d="M6 6.5A2.5 2.5 0 0 1 8.5 4h7A2.5 2.5 0 0 1 18 6.5v7" />
              <path d="M8 20h-1.5A2.5 2.5 0 0 1 4 17.5V8" />
              <path d="M13.5 14.5 18 10l2 2-4.5 4.5-3 .8z" />
            </svg>
          </button>
        </div>
        <div class="topbar-side topbar-right">
          <button class="icon-button" aria-label="Assistant style control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4c-.9 2.1-1.3 4.2-1.1 6.4.1 1.4.6 2.9.4 4.4-.2 1.7-1 3.2-2.3 4.5" />
              <path d="M12.6 4.2c1 1.1 1.7 2.6 1.9 4.1.4 2.6-.6 5.2-.3 7.8.1 1 .4 2 .9 2.9" />
            </svg>
          </button>
          <button class="icon-button" aria-label="Panel layout">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.5" y="6" width="15" height="12" rx="1.8" />
              <path d="M14 6v12" />
            </svg>
          </button>
          <button class="icon-button chevron" aria-label="Panel layout options">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5" />
            </svg>
          </button>
          <button class="icon-button close-top" aria-label="Close panel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12" />
              <path d="M18 6 6 18" />
            </svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <div class="chips" aria-label="Suggested actions">
          <div class="chip">Analyze</div>
          <div class="chip">Explain</div>
          <div class="chip">Summarize</div>
        </div>

        <section class="composer" aria-label="Composer">
          <div class="composer-head">
            <div class="context-pill">
              <div class="context-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="5" width="14" height="14" rx="4" />
                  <path d="M8.5 15.5c1.4-1.9 2.9-4 5.3-4 1.2 0 2 .5 2.7 1.4" />
                  <path d="M9 10.5h.01" />
                </svg>
              </div>
              <div class="context-copy">
                <div class="context-title">Dia Browser | Lates…</div>
                <div class="context-url">diabrowser.com</div>
              </div>
            </div>
            <button class="composer-close" aria-label="Remove page context">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7l10 10" />
                <path d="M17 7 7 17" />
              </svg>
            </button>
          </div>

          <div class="placeholder">Ask a question about this page...</div>

          <div class="composer-footer">
            <div class="control-group" aria-label="Additional controls">
              <button class="action" aria-label="Add">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14" />
                  <path d="M5 12h14" />
                </svg>
              </button>
              <button class="action secondary" aria-label="More options">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none" />
                  <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
                  <circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none" />
                </svg>
              </button>
            </div>

            <div class="control-group" aria-label="Media and send controls">
              <button class="action" aria-label="Camera">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 9h9a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2Z" />
                  <path d="M17 12l3-2v7l-3-2" />
                </svg>
              </button>
              <button class="action" aria-label="Microphone">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3Z" />
                  <path d="M7 11.5a5 5 0 0 0 10 0" />
                  <path d="M12 17v3" />
                </svg>
              </button>
              <button class="send" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h14" />
                  <path d="M13 6l6 6-6 6" />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
