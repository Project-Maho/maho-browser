<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Bar Mockup</title>
  <style>
    :root {
      --page: #141517;
      --panel: rgba(18, 18, 19, 0.96);
      --panel-border: #4e5054;
      --divider: #2a2b2d;
      --url-fill: #727478;
      --url-text: #f3f3f4;
      --title: #ebebeb;
      --meta: #686a6d;
      --selected-fill: #777062;
      --selected-title: #f2efe9;
      --icon-dim: #d8d8d8;
      --radius-panel: 22px;
      --radius-row: 12px;
      --radius-tile: 10px;
      --left-gutter: 30px;
      --icon-lane: 48px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--page);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
      color: var(--title);
    }

    .overlay {
      position: absolute;
      inset: 0 0 2px 0;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-panel);
      background: var(--panel);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: var(--icon-lane) minmax(0, 1fr);
      align-items: center;
      column-gap: 24px;
      padding: 28px 27px 20px var(--left-gutter);
    }

    .divider {
      height: 1px;
      margin: 0 15px;
      background: var(--divider);
    }

    .spark {
      width: var(--icon-lane);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spark svg,
    .gemini-spark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .urlbar {
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 17px;
      border-radius: 3px;
      background: var(--url-fill);
      color: var(--url-text);
      font-size: 33px;
      font-weight: 650;
      letter-spacing: -0.042em;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .results {
      padding: 14px 0 34px;
    }

    .row {
      display: grid;
      grid-template-columns: var(--icon-lane) minmax(0, 1fr);
      align-items: center;
      column-gap: 24px;
      min-height: 72px;
      padding: 0 var(--left-gutter);
    }

    .row + .row {
      margin-top: 18px;
    }

    .row.selected {
      grid-template-columns: var(--icon-lane) minmax(0, 1fr);
      min-height: 90px;
      margin: 14px 12px 26px;
      padding: 0 18px;
      border-radius: var(--radius-row);
      background: var(--selected-fill);
    }

    .icon-wrap {
      width: var(--icon-lane);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--icon-dim);
      flex: 0 0 auto;
    }

    .row.selected .icon-wrap {
      width: var(--icon-lane);
      height: 48px;
      border-radius: var(--radius-tile);
      background: #f5f3ef;
      color: #ffffff;
    }

    .google-icon {
      width: 30px;
      height: 30px;
      position: relative;
      border-radius: 50%;
      background: conic-gradient(#4285f4 0 90deg, #34a853 90deg 180deg, #fbbc05 180deg 270deg, #ea4335 270deg 360deg);
    }

    .google-icon::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: var(--panel);
    }

    .google-icon::after {
      content: "G";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4285f4;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .globe svg,
    .mail svg,
    .search svg {
      width: 31px;
      height: 31px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .geek-icon {
      width: 34px;
      height: 30px;
      color: #5f6164;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: none;
    }

    .contact-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #2d2e30;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d5d7da;
    }

    .contact-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    .title,
    .meta {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .title {
      font-size: 27px;
      font-weight: 630;
      color: var(--title);
      flex: 0 1 auto;
    }

    .meta {
      flex: 1 1 auto;
      font-size: 26px;
      font-weight: 560;
      color: var(--meta);
    }

    .row.selected .title {
      color: var(--selected-title);
    }

    .row.selected .meta {
      display: none;
    }

    .bottom-spacer {
      height: 78px;
    }

    @media (max-width: 1200px) {
      .topbar {
        grid-template-columns: 42px minmax(0, 1fr);
        column-gap: 18px;
        padding: 22px 20px 16px 22px;
      }

      .urlbar {
        height: 38px;
        font-size: 26px;
      }

      .results {
        padding: 12px 0 28px;
      }

      .row {
        grid-template-columns: 42px minmax(0, 1fr);
        column-gap: 18px;
        min-height: 60px;
        padding: 0 22px;
      }

      .row.selected {
        grid-template-columns: 42px minmax(0, 1fr);
        min-height: 76px;
        margin: 12px 10px 22px;
        padding: 0 12px;
      }

      .icon-wrap {
        width: 42px;
        height: 32px;
      }

      .row.selected .icon-wrap {
        width: 42px;
        height: 42px;
      }

      .globe svg,
      .mail svg,
      .search svg {
        width: 25px;
        height: 25px;
      }

      .contact-icon {
        width: 38px;
        height: 38px;
      }

      .contact-icon svg {
        width: 22px;
        height: 22px;
      }

      .google-icon {
        width: 24px;
        height: 24px;
      }

      .geek-icon {
        width: 28px;
        font-size: 8px;
      }

      .title {
        font-size: 22px;
      }

      .meta {
        font-size: 21px;
      }

      .bottom-spacer {
        height: 56px;
      }

      .spark {
        width: 42px;
        height: 42px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 32px minmax(0, 1fr);
        column-gap: 12px;
        padding: 14px 12px 12px 12px;
      }

      .spark {
        width: 32px;
        height: 32px;
      }

      .row {
        grid-template-columns: 32px minmax(0, 1fr);
        column-gap: 12px;
        padding: 0 12px;
      }

      .row.selected {
        margin: 10px 8px 16px;
        padding: 0 8px;
      }

      .icon-wrap {
        width: 32px;
        height: 32px;
      }

      .row.selected .icon-wrap {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" role="dialog" aria-label="Command bar mockup">
    <div class="topbar">
      <div class="spark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <defs>
            <linearGradient id="spark-grad-top" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#57b3ff" />
              <stop offset="100%" stop-color="#826bff" />
            </linearGradient>
            <linearGradient id="spark-grad-bottom" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff7a59" />
              <stop offset="100%" stop-color="#ffd15d" />
            </linearGradient>
          </defs>
          <path fill="url(#spark-grad-top)" d="M12 2.6 14.3 8.2 20 10.5 14.3 12.8 12 18.4 9.7 12.8 4 10.5 9.7 8.2Z"/>
          <path fill="url(#spark-grad-bottom)" d="M12 6.5 13.5 10.2 17.2 11.7 13.5 13.2 12 16.9 10.5 13.2 6.8 11.7 10.5 10.2Z"/>
        </svg>
      </div>
      <div class="urlbar">https://gemini.google.com/u/2/app/36c3f40be8fe2e4c?pageId=none</div>
    </div>
    <div class="divider"></div>

    <div class="results">
      <div class="row selected">
        <div class="icon-wrap gemini-spark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <defs>
              <linearGradient id="spark-grad-top-selected" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#57b3ff" />
                <stop offset="100%" stop-color="#826bff" />
              </linearGradient>
              <linearGradient id="spark-grad-bottom-selected" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#ff7a59" />
                <stop offset="100%" stop-color="#ffd15d" />
              </linearGradient>
            </defs>
            <path fill="url(#spark-grad-top-selected)" d="M12 2.6 14.3 8.2 20 10.5 14.3 12.8 12 18.4 9.7 12.8 4 10.5 9.7 8.2Z"/>
            <path fill="url(#spark-grad-bottom-selected)" d="M12 6.5 13.5 10.2 17.2 11.7 13.5 13.2 12 16.9 10.5 13.2 6.8 11.7 10.5 10.2Z"/>
          </svg>
        </div>
        <div class="line">
          <div class="title">스마트폰 피로감 일본어 설명 - Google Gemini</div>
          <div class="meta"></div>
        </div>
      </div>

      <div class="row">
        <div class="icon-wrap" aria-hidden="true">
          <div class="google-icon"></div>
        </div>
        <div class="line">
          <div class="title">로그인 - Google 계정</div>
          <div class="meta">— accounts.google.c…13%2foauth-callback</div>
        </div>
      </div>

      <div class="row">
        <div class="icon-wrap globe" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M4 12h16"></path>
            <path d="M12 4c2.7 2.2 4 4.8 4 8s-1.3 5.8-4 8"></path>
            <path d="M12 4c-2.7 2.2-4 4.8-4 8s1.3 5.8 4 8"></path>
          </svg>
        </div>
        <div class="line">
          <div class="title">Part 1: 기초 다지기 - Slidev</div>
          <div class="meta">— localhost:3456</div>
        </div>
      </div>

      <div class="row">
        <div class="icon-wrap" aria-hidden="true">
          <div class="geek-icon"><span>Geek</span><span>News</span></div>
        </div>
        <div class="line">
          <div class="title">’제미나이 인 크롬’으로 더욱 스마트하고 편리해진 크롬이 한국에 출시됩니다 | GeekNews</div>
          <div class="meta">— news.hada.io/..._campaign=5047</div>
        </div>
      </div>

      <div class="bottom-spacer"></div>
    </div>
  </div>
</body>
</html>
