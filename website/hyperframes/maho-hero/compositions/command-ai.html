<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Maho Command Bar and AI</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../shared/frame.js"></script>
  </head>
  <body>
    <div
      id="command-ai-root"
      class="maho-frame"
      data-composition-id="command-ai"
      data-start="0"
      data-duration="26.733333"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <img
        id="command-ai-background"
        class="maho-background-layer maho-background-image"
        data-maho-background
        src="../assets/originals/water-lilies.jpg"
        width="1920"
        height="1080"
        alt=""
        aria-hidden="true"
      />
      <div
        id="command-ai-camera"
        class="maho-browser-camera"
        data-maho-camera-wrapper="command-ai"
      >
        <div id="command-ai-mask" class="maho-browser-mask">
          <video
            id="command-ai-source"
            class="maho-source-video"
            src="../assets/originals/command-ai.mov"
            width="2818"
            height="2060"
            data-start="0"
            data-duration="26.733333"
            data-track-index="0"
            data-media-start="0"
            data-playback-rate="1"
            muted
            playsinline
            preload="auto"
          ></video>
        </div>
      </div>
    </div>

    <script>
      MahoHeroFrame.registerCameraTimeline("command-ai", (camera) => {
        camera
          .set({ x: 0, y: 0, scale: 1, opacity: 1 }, 0)
          .to({ x: 0, y: 0, scale: 1.09, duration: 1.5, ease: "power3.inOut" }, 5)
          .to({ x: -112, y: 0, scale: 1.09, duration: 2.4, ease: "power3.inOut" }, 16.4)
          .to({ x: -20, y: 0, scale: 1.02, duration: 1.8, ease: "power3.inOut" }, 24.7);
      });
    </script>
  </body>
</html>
