<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Maho Spaces</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../shared/frame.js"></script>
  </head>
  <body>
    <div
      id="spaces-root"
      class="maho-frame"
      data-composition-id="spaces"
      data-start="0"
      data-duration="12.733333"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <img
        id="spaces-background"
        class="clip maho-background-layer maho-background-image"
        data-maho-background
        data-start="0"
        data-duration="12.733333"
        data-track-index="0"
        src="../assets/originals/water-lilies.jpg"
        alt=""
      />
      <div class="maho-browser-camera" data-maho-camera-wrapper="spaces">
        <div class="maho-browser-mask">
          <video
            id="spaces-source"
            class="clip maho-source-video"
            data-start="0"
            data-duration="12.733333"
            data-track-index="1"
            data-media-start="0"
            src="../assets/originals/spaces.mov"
            muted
            playsinline
          ></video>
        </div>
      </div>
    </div>

    <script>
      MahoHeroFrame.registerCameraTimeline("spaces", (camera) => {
        camera
          .set({ x: 0, y: 0, scale: 1, opacity: 1 }, 0)
          .to({ x: 96, y: -12, scale: 1.1, duration: 1.8, ease: "power2.inOut" }, 8.2)
          .to({ x: 24, y: -4, scale: 1.03, duration: 1.8, ease: "power2.inOut" }, 10.8);
      });
    </script>
  </body>
</html>
