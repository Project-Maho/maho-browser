<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .background { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 8%, #26222b 0%, #17151b 46%, #0c0b0f 100%); }
      .frame { position: absolute; left: 210px; top: 60px; width: 1500px; height: 949px; border-radius: 26px; overflow: hidden; background: #000; box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06); object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="spaces-root" data-composition-id="spaces" data-start="0" data-duration="6.666667" data-width="1920" data-height="1080" style="position: relative; width: 1920px; height: 1080px; overflow: hidden;">
      <div class="background"></div>
      <div id="spaces-camera">
        <video id="spaces-video" class="frame clip" src="assets/spaces-fast.mp4" data-start="0" data-duration="6.666667" data-track-index="1" muted playsinline></video>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      timeline.set("#spaces-camera", { scale: 1, xPercent: 0 }, 0);
      window.__timelines.spaces = timeline;
    </script>
  </body>
</html>
