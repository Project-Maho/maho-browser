<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      .bg-fill {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 8%, #26222b 0%, #17151b 46%, #0c0b0f 100%);
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .frame {
        position: absolute;
        left: 210px;
        top: 60px;
        width: 1500px;
        height: 949px;
        border-radius: 26px;
        overflow: hidden;
        object-fit: cover;
        background: #000;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
      style="position: relative; width: 1920px; height: 1080px; overflow: hidden;"
    >
      <div class="bg-fill"></div>

      <div class="scene">
        <div id="cam-spaces" class="cam">
          <video
            id="video-spaces"
            class="frame clip"
            src="assets/spaces.mp4"
            data-start="0"
            data-duration="8"
            data-track-index="1"
            muted
            playsinline
          ></video>
        </div>
      </div>

      <div class="scene">
        <div id="cam-split" class="cam">
          <video
            id="video-split"
            class="frame clip"
            src="assets/split-view.mp4"
            data-start="8"
            data-duration="8"
            data-track-index="1"
            muted
            playsinline
          ></video>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set("#cam-spaces", { scale: 1, xPercent: 0 }, 0);
      tl.set("#cam-split", { scale: 1, xPercent: 0, transformOrigin: "30% 58%" }, 8);

      tl.to("#cam-split", { scale: 1.075, xPercent: 1.2, duration: 1.4, ease: "power2.inOut" }, 10);
      tl.to("#cam-split", { scale: 1.075, xPercent: 1.2, duration: 1.4, ease: "none" }, 11.4);
      tl.to("#cam-split", { scale: 1, xPercent: 0, duration: 1.4, ease: "power2.out" }, 12.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
