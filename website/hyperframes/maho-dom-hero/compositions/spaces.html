<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Maho DOM Spaces</title>
    <link rel="stylesheet" href="/shared/shell.css" />
    <link rel="stylesheet" href="/shared/demo-pages.css" />
    <link rel="stylesheet" href="/assets/spaces.css" />
    <script src="/node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="spaces" data-start="0" data-duration="12.6" data-width="1920" data-height="1080" data-fps="30">
      <section id="spaces-scene" class="clip" data-start="0" data-duration="12.6" data-track-index="0" aria-label="Maho Spaces browser composition">
        <img data-water-lilies src="/assets/water-lilies.jpg" alt="" />
        <div data-spaces-atmosphere aria-hidden="true"></div>
        <div id="spaces-browser-wrapper">
          <div id="spaces-shell-mount"></div>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      window.__timelines["spaces"] = timeline;
    </script>
    <script type="module" src="/assets/spaces.js"></script>
  </body>
</html>
