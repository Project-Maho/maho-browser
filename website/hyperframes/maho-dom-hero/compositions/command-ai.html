<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Maho DOM Command AI entry</title>
    <script src="/node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="/shared/shell.css" />
    <link rel="stylesheet" href="/shared/command-ai.css" />
    <link rel="stylesheet" href="/assets/command-ai.css" />
    <style>
      @font-face {
        font-family: "Geist";
        src: local("Avenir Next");
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Geist Mono";
        src: local("SFMono-Regular");
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "SFMono-Regular";
        src: local("SF Mono");
        font-style: normal;
        font-weight: 400;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="command-ai"
      data-start="0"
      data-duration="26.6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <section id="command-ai-scene" class="clip" data-start="0" data-duration="26.6" data-track-index="0">
        <div id="command-ai-camera-wrapper" data-scene-wrapper="camera">
          <div id="command-ai-browser-mount"></div>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      window.__timelines["command-ai"] = timeline;
    </script>
    <script type="module" src="/assets/command-ai.js"></script>
  </body>
</html>
