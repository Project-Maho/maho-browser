<!DOCTYPE html>
<html id="zenBoostWindow" lang="en" editor="boost" data-platform="macos" style="height: 100%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maho Boost</title>
  <script>
    (() => {
      const root = document.documentElement;
      const platform = navigator.platform.toLowerCase();
      let resolvedPlatform = 'linux';
      if (platform.includes('mac')) {
        resolvedPlatform = 'macos';
      } else if (platform.includes('win')) {
        resolvedPlatform = 'windows';
      }
      root.dataset.platform = resolvedPlatform;
      if (!root.hasAttribute('editor')) {
        root.setAttribute('editor', 'boost');
      }
    })();
  </script>
  <link rel="stylesheet" href="boost.css">
  <link rel="stylesheet" href="zen-advanced-color-options.css">
</head>
<body style="height: 100%">
  <div id="zen-boost-editor-root" style="display: flex; flex-direction: column; flex: 1">
    <div id="zen-boost-head-wrapper">
      <button id="zen-boost-close" class="subviewbutton mod-button title-button" type="button" title="Close"></button>
      <div id="zen-boost-name" style="display: flex; flex-direction: row; flex: 1">
        <div id="zen-boost-name-container">
          <p id="zen-boost-name-text">Boost Name</p>
        </div>
      </div>
      <button data-l10n-id="zen-boost-shuffle" id="zen-boost-shuffle" class="subviewbutton mod-button title-button" type="button" title="Shuffle Vibes"></button>
    </div>
    <div id="zen-boost-filter-wrapper" style="display: flex; flex-direction: column; flex: 1">
      <div class="zen-boost-color-picker-gradient zen-boost-panel-disabled">
        <button data-l10n-id="zen-boost-magic-theme" id="zen-boost-magic-theme" class="subviewbutton mod-button" type="button" title="Magic Theme"></button>
        <div id="zen-boost-color-picker-dot-primary" class="zen-boost-color-picker-dot"></div>
        <div id="zen-boost-color-picker-dot-secondary" class="zen-boost-color-picker-dot"></div>
        <div class="zen-boost-color-picker-circle"></div>
      </div>
      <div id="zen-boost-toolbar-wrapper-colors" style="display: flex; flex-direction: row; flex: 1">
        <button data-l10n-id="zen-boost-invert" id="zen-boost-invert" class="subviewbutton mod-button small" type="button" title="Invert"></button>
        <button data-l10n-id="zen-boost-controls" id="zen-boost-controls" class="subviewbutton mod-button small" type="button" title="Controls"></button>
        <button data-l10n-id="zen-boost-disable" id="zen-boost-disable" class="subviewbutton mod-button small" type="button" title="Disable"></button>
      </div>
      <div id="zen-boost-font-wrapper">
        <div id="zen-boost-font-grid">
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
          <button type="button">Aa</button>
        </div>
        <div class="visible-separator"></div>
        <div id="zen-boost-font-toolbar" style="display: flex; flex-direction: row; flex: 1">
          <select name="font" id="zen-boost-font-select" class="mod-button">
            <option value="">Default font</option>
          </select>
        </div>
      </div>
      <div id="zen-boost-toolbar-wrapper" style="display: flex; flex-direction: row; flex: 1">
        <button id="zen-boost-size" class="subviewbutton mod-button big-button med" type="button">
          <p data-l10n-id="zen-boost-size" id="zen-boost-size-text">Size</p>
          <p id="zen-boost-size-value">110%</p>
        </button>
        <button id="zen-boost-case" class="subviewbutton mod-button big-button toggleable-button med" type="button" case-mode="none" mode="none">
          <p data-l10n-id="zen-boost-case" id="zen-boost-case-text">Case</p>
        </button>
      </div>
      <button id="zen-boost-zap" class="subviewbutton mod-button big-button toggleable-button" type="button" enabled="false" hideicon="false">
        <p data-l10n-id="zen-boost-zap" id="zen-boost-zap-text">Zap</p>
        <p id="zen-boost-zap-value">0</p>
      </button>
      <button id="zen-boost-code" class="subviewbutton mod-button big-button" type="button">
        <p data-l10n-id="zen-boost-code" id="zen-boost-code-text">Code</p>
      </button>
    </div>
  </div>
  <div id="zen-boost-code-editor-root" style="display: none; flex-direction: column; flex: 1">
    <div id="zen-boost-code-top-bar">
      <button id="zen-boost-back" class="subviewbutton mod-button big-button" type="button">
        <p data-l10n-id="zen-boost-back" id="zen-boost-back-text">Back</p>
      </button>
    </div>
    <div id="zen-boost-code-editor" style="display: flex; flex-direction: column; flex: 1"></div>
    <div id="zen-boost-code-bottom-bar">
      <button data-l10n-id="zen-boost-css-picker" id="zen-boost-css-picker" class="subviewbutton mod-button big-button toggleable-button" type="button" enabled="false" title="Color Picker"></button>
      <button data-l10n-id="zen-boost-css-inspector" id="zen-boost-css-inspector" class="subviewbutton mod-button big-button" type="button" title="Inspector"></button>
    </div>
  </div>
  <div id="mainPopupSet">
    <div id="zen-boost-advanced-color-options-panel" role="dialog" data-popup-align="topmiddle" style="position: fixed" hidden>
      <div>
        <p data-l10n-id="zen-bootst-color-contrast">Contrast</p>
        <input id="zen-boost-color-contrast" type="range" min="0.05" max="0.9" value="0.75" step="0.01">
      </div>
      <div>
        <p data-l10n-id="zen-bootst-color-brightness">Brightness</p>
        <input id="zen-boost-color-brightness" type="range" min="0" max="1" value="0.5" step="0.01">
      </div>
      <div>
        <p data-l10n-id="zen-bootst-color-original-saturation">Original Saturation</p>
        <input id="zen-boost-color-saturation" type="range" min="0" max="1" value="0.5" step="0.01">
      </div>
    </div>
    <div id="zenBoostContextMenu" role="menu" style="position: fixed" hidden>
      <button data-l10n-id="zen-boost-edit-rename" id="zen-boost-edit-rename" type="button">Rename Boost</button>
      <button data-l10n-id="zen-boost-edit-shuffle" id="zen-boost-edit-shuffle" type="button">Shuffle Vibes</button>
      <button data-l10n-id="zen-boost-edit-reset" id="zen-boost-edit-reset" type="button">Reset All Edits</button>
      <div role="separator"></div>
      <button data-l10n-id="zen-boost-load" id="zen-boost-load" type="button">Import Boost</button>
      <button data-l10n-id="zen-boost-save" id="zen-boost-save" type="button">Export Boost</button>
      <div role="separator"></div>
      <button data-l10n-id="zen-boost-edit-delete" id="zen-boost-edit-delete" type="button">Delete Boost</button>
    </div>
  </div>
  <script src="codemirror.bundle.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
