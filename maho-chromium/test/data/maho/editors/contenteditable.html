<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ContentEditable Test Fixture (cancels keydown, accepts beforeinput)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 40px auto;
      max-width: 700px;
      padding: 0 20px;
    }
    #editor {
      border: 2px solid #0066cc;
      border-radius: 6px;
      padding: 16px;
      min-height: 120px;
      outline: none;
      font-size: 16px;
      background: #fafafa;
    }
    #editor:focus {
      border-color: #004499;
      background: #ffffff;
    }
    .status-panel {
      margin-top: 20px;
      padding: 16px;
      background: #f0f4f8;
      border-radius: 6px;
      font-size: 14px;
    }
    .field-label {
      font-weight: 600;
      color: #333;
    }
    .value {
      font-family: monospace;
      padding: 2px 6px;
      background: #e2e8f0;
      border-radius: 4px;
    }
    #events-log {
      margin-top: 15px;
      font-family: monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 10px;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>ContentEditable Fixture</h1>
  <p>Cancels all <code>keydown</code> events, forcing input via <code>beforeinput</code>.</p>
  <div id="editor" contenteditable="true" tabindex="0"></div>

  <div class="status-panel">
    <p><span class="field-label">Observed Strategy:</span> <span id="strategy" class="value">none</span></p>
    <p><span class="field-label">Typed Text:</span> <span id="typed-text" class="value"></span></p>
    <div id="events-log"></div>
  </div>

  <script>
    window.__editorState = {
      strategy: "none",
      text: ""
    };

    const editor = document.getElementById("editor");
    const strategyEl = document.getElementById("strategy");
    const textEl = document.getElementById("typed-text");
    const logEl = document.getElementById("events-log");

    function logEvent(name, detail) {
      logEl.textContent += `[${name}] ${detail}\n`;
    }

    function recordInput(strategy, text) {
      window.__editorState.strategy = strategy;
      window.__editorState.text = text;
      strategyEl.textContent = strategy;
      textEl.textContent = text;
    }

    editor.addEventListener("keydown", (e) => {
      logEvent("keydown", `key=${e.key} code=${e.code} (cancelling)`);
      e.preventDefault();
    });

    editor.addEventListener("beforeinput", (e) => {
      logEvent("beforeinput", `inputType=${e.inputType} data=${e.data}`);
      if (e.data) {
        document.execCommand("insertText", false, e.data);
        recordInput("beforeinput", editor.innerText.trim());
      } else if (e.inputType === "insertFromPaste" && e.dataTransfer) {
        const text = e.dataTransfer.getData("text/plain");
        document.execCommand("insertText", false, text);
        recordInput("beforeinput", editor.innerText.trim());
      }
    });

    editor.addEventListener("paste", (e) => {
      const text = (e.clipboardData || window.clipboardData).getData("text/plain");
      logEvent("paste", `pasted text=${text}`);
      e.preventDefault();
      document.execCommand("insertText", false, text);
      recordInput("paste", editor.innerText.trim());
    });

    editor.addEventListener("input", (e) => {
      logEvent("input", `current text=${editor.innerText.trim()}`);
      if (window.__editorState.strategy !== "none") {
        textEl.textContent = editor.innerText.trim();
        window.__editorState.text = editor.innerText.trim();
      }
    });
  </script>
</body>
</html>
